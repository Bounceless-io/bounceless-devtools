name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm pack:release
      - run: pnpm verify:release
      - name: CI must not reference Actions secrets context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          needle = "${" + "{ secrets."
          hits = []
          for path in Path(".github/workflows").rglob("*"):
              if path.is_file():
                  for lineno, line in enumerate(path.read_text(encoding="utf-8", errors="replace").splitlines(), 1):
                      if needle in line and "needle = " not in line:
                          hits.append(f"{path}:{lineno}")
          if hits:
              raise SystemExit("Actions secrets context is forbidden in public CI")
          PY
      - name: No credential-shaped files in tree
        run: |
          hits="$(find . -path ./.git -prune -o \( -name '.env' -o -name '*.pem' -o -name '*.p12' -o -name 'id_rsa*' \) -print)"
          test -z "$hits"
